<p>წმიდა მოციქული აეტი საჭურისი იყო და ეთიოპიის დედოფლის, კანდაკის საგანძურის 
მცველად მსახურობდა. წმიდანი იერუსალიმიდან ღაზაში მიმავალ გზაზე მონათლა ფილიპე 
მოციქულმა (საქმე; 8,26-40), რის შემდეგაც ეთიოპიის განმანათლებელი გახდა.</p>
