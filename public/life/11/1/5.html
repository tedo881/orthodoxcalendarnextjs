წმიდა მოწამენი: კესარიოსი, დასიოსი და მათ თანა ხუთნი მოწამენი, VII საუკუნეში, როცა ქალაქი დამასკო მაჰმადიანებმა დაიპყრეს, ქრისტეს მხნე აღსარებისთვის კესარიოსსა, დასიოსს და კიდევ ხუთ ქრისტიანს, რომელთა სახელები არ შემონახულა თავები მოჰკვეთეს.
