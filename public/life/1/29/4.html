<p>წმიდა მოწამენი: რომანოზი, იაკობი, ფილოთეოზი, იპერიხი, აბიბოსი, იულიანე და 
პარიგორი ქალაქ სამოსატში (სირია) ეწამნენ 297 წელს, დიოკლეტიანეს დროინდელი 
დევნულობისას. მათ უშიშრად ამხილეს კერპთმსახურთა უგნურება, რისთვისაც საშინელი 
წამების დათმენა მოუხდათ. ბოლოს ჯვარს აცვეს და თავებით ძელზე მიალურსმნეს.</p>
