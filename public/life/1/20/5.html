	<p>წმიდა მოწამე ზაქარია ქრისტეს აღსარებისთვის თურქებმა აწამეს ძველ პატრებში 
(პელოპონესში) 1782 წელს. მან ჯერ უარყო ქრისტე და გამაჰმადიანდა, მაგრამ შემდეგ 
შეინანა და დაუბრუნდა ჭეშმარიტ სარწმუნოებას. წმიდანი ხეზე დაკიდული აღესრულა.</p>
