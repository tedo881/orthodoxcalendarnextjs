<p>
ღირსი ფოსტერი მეუდაბნოე მაღალ მთაზე მოსაგრეობდა. თავისი სასწაულებით და წმიდა 
ცხოვრებით მრავალი დაიცვა ერეტიკოსთა მომწამვლელი სწავლებისაგან.</p>
<p>
ღირსი მინა 50 წელი მოღვაწეობდა სინას მონასტერში. მშვიდობით მიიცვალა VI საუკუნის 
II ნახევარში.</p>
