<p>ღირსი პეტრე ატროელი აზიის ოლიმპოს მახლობლად, ქალაქ ატროაში მოსაგრეობდა. ნეტარი 
ყოველთვის რკინის ჯაჭვებს ატარებდა. ღირსმა პეტრემ სიცოცხლეშივე მრავალი სასწაული 
აღასრულა. ბოლოს, კონსტანტინოპოლელ პატრიარქ ტარასისა (784-806) და იმპერატორ 
ნიკიფორეს (802-811) დროს, წმიდანმა მშვიდობით შეჰვედრა სული უფალს.</p>
