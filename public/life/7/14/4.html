<p>ღირსმა ონისიმე საკვირველთმოქმედმა დიოკლეტიანეს მიერ ქრისტიანთა სასტიკი დევნისას 
ჭეშმარიტი სარწმუნოების აღსარებისთვის აწამეს, მაგრამ ცოცხალი გადარჩა. შემდეგ 
ნეტარმა მამამ მაგნეზიაში (მცირე აზია) მონასტერი ააშენა და იქვე მიიცვალა 
ღვთივსათნო ღვაწლში.</p>
