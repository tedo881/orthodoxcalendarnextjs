<p>წმიდა მოწამენი დიომიდე, ევლამპიოსი, ასკლიპიოდოტე და გოლინდუხა ნეტარ იაკინთესთან 
ერთად მოწამეობრივად აღსრულებული თეოდოტესა და თეოდოტიას (ხს. 4 ივლისს) რაზმის 
წევრები იყვნენ. ახოვანმა მეომრებმა გაბედულად აღიარეს ქრისტე, სისხლი დასთხიეს 
მისი სახელისთვის და, განწმენდილები, ზეციურ მხედრობას შეერთვნენ.</p>
