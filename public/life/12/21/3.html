<p>წმიდა მოწამე თემისტოკლე ლუკიის ქალაქ მირონში ცხოვრობდა ღვთისმებრძოლი 
იმპერატორის, დეკიუსის (249-251) ზეობისას. თემისტოკლე მწყემსი იყო. ქრისტიანთა 
დევნის დროს წმიდანმა ვინმე მართლმორწმუნე დიოსკორიდე შეიფარა სახლში, თვითონ კი 
მდევნელებს ჩაბარდა და საშინელი წამების შემდეგ სული უფალს შეჰვედრა (+251).</p>
