ქრისტიან ქვრივთა მსახურებისთვის გამოარჩიეს. შემდგომში იგი არაბეთის ქალაქ

ბოლოს კი მოწამეობრივად აღესრულა (იხ. 28 ივლისის საკითხავი).</p>
