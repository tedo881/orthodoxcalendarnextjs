<p>წმიდა მოწამე ალექსანდრე დერვიში (მუსულმანი უპოვარი ბერი) თესალონიკში ცხოვრობდა, 
მაგრამ, ღვთის ნებით, ჭეშმარიტ სარწმუნოებაზე მოექცა. ქრისტეს აღსარებისთვის 1794 
წელს ქალაქ ზმირნაში თურქებმა მას თავი მოჰკვეთეს.</p>
