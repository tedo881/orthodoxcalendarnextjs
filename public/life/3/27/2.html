მოწამენი მანუელი და თეოდოსი ეწამნენ დიოკლეტიანეს (284-305) დროს. ისინი ხედავდნენ, თუ როგორ ხოცავდნენ ქრისტიანებს ყოველდღიურად, თვითონაც ქრისტესთვის წამების სურვილით აენთნენ და ნებით ჩაბარდნენ ჯალათებს. საშინელი წამების შემდეგ წმიდანებს თავები მოჰკვეთეს. ეს მოხდა 304 წლის 26 მარტს.<p>
