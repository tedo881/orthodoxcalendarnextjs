<p>წმიდა მოწამე კონონი (III) გალილეის ნაზარეთში დაიბადა, ცხოვრობდა ქალაქ მანდონში. 
ღვთისმოშიში, კეთილი, მდაბალი და მოსიყვარულე ქრისტიანი იმპერატორ დეკიუსის 
(249-251) დროს დაიჭირეს, ხელ-ფეხი სამსჭვალებით დაუხვრიტეს, ბორბალზე გააკრეს და 
აწამეს. წმიდანი გამუდმებით ლოცულობდა და ასე მიაბარა სული უფალს.</p>
