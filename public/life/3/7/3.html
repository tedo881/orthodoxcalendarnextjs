წმიდა პავლე აღმსარებელი (IX) პრუსაიდის (მცირე აზია) ეპარქიას მართავდა 
ხატმებრძოლობის ერესის მძვინვარების პერიოდში. წმიდა პავლე წმიდა თეოფილაქტესთან 
(ხს. 8 მარტს) ერთად მხნედ დადგა სიწმიდეთა დასაცავად, დაითმინა მრავალი ტანჯვა და 
დევნა; გარდაიცვალა დაახლოებით 850 წელს.</p>
