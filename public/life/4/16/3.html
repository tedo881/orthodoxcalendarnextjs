<p>წმიდა მოწამე ირინე სხვა ქრისტიანებთან ერთად გამოქვაბულში ცხოვრობდა მკაცრი 
ასკეტური ღვაწლით. წარმართთა დასმენით იგი შეიპყრეს და ციხეში ჩააგდეს, ქრისტეს 
უშიშრად აღიარებისთვის სასტიკად აწამეს: ამოგლიჯეს ენა, ჩაულეწეს კბილები, ბოლოს კი 
თავი მოჰკვეთეს დაახლოებით 205-304 წლებში.</p>
