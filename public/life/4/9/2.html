<p>წმიდა მოწამენი: დისან ეპიკოპოსი, მარიავა ხუცესი, ავდიესი და სხვა 270 მოწამე - 
აღესრულნენ 362-364 წლებში, სპარსეთის მეფის საპორ II-ის დროს. ტყვეობაში 
ჩავარდნილმა ქრისტიანებმა უარი განაცხადეს სარწმუნოების უარყოფაზე. მათ რიცხვში იყო 
მოწამე ია, რომელიც იხსენიება 11 სექტემბერს.</p>
